# The oh-web-app bundle patch: the browser surface over the oh-base layer.
# Applied after oh-base's insert; rows here override base rows by id, with
# the profile's own cordis.patch.yml and any --patch overlays still to come.
#
# A patch replaces the targeted row's whole `config`, so each row below
# restates every key it owns.
#
# The web-startup plugin injects `cmdlineArgs` and provides `webStartup` as an
# ordinary Cordis service. Rows configured from flags inject that service, so
# Loader resolves their expressions only after it exists. The web runtime then
# provides bind-dependent `webRuntime` values to the trust fence.
# `oh --profile web --help` provides neither service, so no server binds.

# ── surface-specific values the base deliberately omits ─────────────────────

- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

# Full-text session search is opt-in (the base row's `openAt: never`). This
# restatement keeps the Web values on one ephemeral in-memory index; a
# deployment enabling content search overrides `openAt` to `first-search` in a
# later patch layer, which defers the node:sqlite import and in-memory handle
# to the first search so Node 22 startup stays quiet.
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: never

- id: tools
  config:
    # TEMPORARY workaround: OH_TOOLS_MODE (native|ptc|both) opts a whole oh
    # process into PTC mode while per-session tool-presentation selection is being
    # designed; unset keeps the schema default (native). Remove the env seam
    # once the web UI owns the choice per session.
    mode: !!js process.env.OH_TOOLS_MODE

# ── web-only host rows, the transport layer, and the browser roster ─────────

# `oh.client` rows are the browser roster the modules node half scans into
# window.__OH_BOOT__; the modules row is simultaneously a host row.
- insert:
    # Host-owned opt-in sampled when a new Web session receives its preset
    # delegation tools. The Plugins page edits this settings namespace.
    - id: subagent-model-selection-settings
      name: '@orochi-network/oh-tool-subagent/model-selection-settings'

    - id: message-feedback
      name: '@orochi-network/oh-message-feedback'
      config:
        maxNoteBytes: 8192

    # Browser Session export: `/export` command plus the shared download dialog.
    - id: session-log-download
      name: '@orochi-network/oh-session-log-export'

    # Session-header "Open In..." split button over the host application
    # resolution (macOS/Windows/Linux; a host with no resolved application
    # renders no button). Two halves: the host routes and the browser surface.
    - id: open-in-app
      name: '@orochi-network/oh-host-open-in-app'
      config:
        probeTimeoutMs: 10000
        iconTimeoutMs: 10000
        launchWatchMs: 1000

    - id: ui-open-in-app
      name: '@orochi-network/oh-client-ui-open-in-app'

    - id: workspace
      name: '@orochi-network/oh-workspace'

    - id: session-reference
      name: '@orochi-network/oh-session-reference'

    - id: file-reference-local
      name: '@orochi-network/oh-file-reference-local'

    # Whole-log turn/step counts for the chat stats strip (the sessionStats
    # projection key); the projection registry itself is a base-layer row.
    - id: session-stats
      name: '@orochi-network/oh-session-stats'

    # Whole-log turn outline for the chat turn rail (the turnOutline
    # projection key): every turn stays navigable before its events page in.
    - id: session-turn-outline
      name: '@orochi-network/oh-session-turn-outline'

    # Resolve bind host, SSH launch, and display once at boot, then mount the
    # matching dual-face directory picker. Mount -native or -browse directly in
    # an overlay to pin the interaction.
    - id: directory-picker
      name: '@orochi-network/oh-host-directory-picker-auto'

    # Read-only projection of current Loader entries for trusted client RPCs.
    - id: plugin-inventory
      name: '@orochi-network/oh-host-plugin-inventory'

    # Session commands, cold reads, and live control over Typert Remote.
    - id: session-controller
      name: '@orochi-network/oh-api-session-controller'

    # One background job's observation record streamed over Typert Remote;
    # the roster rides the session control stream above.
    - id: job-controller
      name: '@orochi-network/oh-api-job-controller'
    # Workspace file service: bounded read, directory listing, and the
    # agent-write change feed inside the session workspace root.
    - id: terminal-controller
      name: '@orochi-network/oh-api-terminal-controller'
    - id: workspace-files
      name: '@orochi-network/oh-api-workspace-files'

    # Configuration-surface reads and writes over Typert Remote. Each method
    # reports an actionable error when its settings-domain provider is absent.
    - id: settings-controller
      name: '@orochi-network/oh-api-settings-controller'

    # Workspace commands and reconnect-safe projection over Typert Remote.
    - id: workspace-controller
      name: '@orochi-network/oh-api-workspace-controller'

    - id: cordis-host-runner
      name: '@orochi-network/oh-cordis-host-runner'

    # The Host inspect providers are process-global: the registry rejects a
    # duplicate id, so they register here once and every preset's `tool-cordis`
    # row reads them.
    - id: cordis-inspect-providers
      name: '@orochi-network/oh-tool-cordis/host'

    # Ordinary provider for the parsed Web flags. Its plugin-level injection
    # waits for cmdlineArgs; no launcher metadata or special row kind is needed.
    - id: web-startup
      name: '@orochi-network/oh-web-app/startup'

    # ── layer 2: transport/service ──────────────────────────────────────────────

    # Plain route-registration carrier; host and port come from the app's
    # webStartup provider, with these deployment fallbacks. The dist is served by
    # the web-runtime row below through the fallback seat.
    - id: webserver
      name: '@orochi-network/oh-host-webserver'
      inject: [webStartup]
      config:
        host: !!js ctx.webStartup.host ?? '127.0.0.1'
        port: !!js ctx.webStartup.port ?? 3080
        compression: gzip
        compressionLevel: 1
        compressionThresholdBytes: 1024

    # Web glue owned by this bundle: resolves the built frontend dist (an
    # assembly fact of oh-web-app, never user config), mounts the
    # frontend-static fallback owner, registers the web-surface prompt
    # section and the bash runtime variable, prints the URL line, and opens the
    # canonical local URL after the full Loader tree settles and the required-
    # entry audit passes. The
    # webStartup provider supplies invocation-only values; after the server binds, this row samples
    # LAN trust once and provides `webRuntime`. A complete agent-preset persona
    # suppresses the prompt section for that agent while retaining the host-owned
    # shell variable.
    - id: web-runtime
      name: '@orochi-network/oh-web-app'
      inject: [webStartup]
      config:
        openBrowser: !!js ctx.webStartup.openBrowser
        printUrl: true
        surfaceContext: true
        trustedHosts: !!js ctx.webStartup.trustedHosts

    # The client-plugin reload chain, always mounted: it is idle until a
    # rebuild watcher (pnpm run dev:web) actually rewrites client bundles. It
    # is a row rather than a child of web-runtime because its node half is a
    # client-side package, which a host-side bundle cannot import.
    - id: client-hmr
      name: '@orochi-network/oh-client-hmr'

    # ── browser plugin roster (oh.client rows; node halves are layer-2 hosts) ──

    # Dual-face: the node half scans this tree, composes window.__OH_BOOT__,
    # and serves /plugins/<id>/client.js; the browser half is the module table
    # the shell kernel constructs before cordis exists (adopted as a plugin
    # entry by the kernel, never fetched).
    - id: modules
      name: '@orochi-network/oh-client-modules'

    # Owns both ends of the web transport: node half binds the gateway to the
    # webserver under /api; browser half is the fetch/SSE client.
    - id: connection
      name: '@orochi-network/oh-client-connection'
      inject: [webRuntime]
      config:
        # LAN literals derived from the active bind plus --trusted-host extras.
        # A deployment adding authorities keeps this expression and concatenates
        # its literals, for example: ['app.internal', ...ctx.webRuntime.trustedHosts].
        trustedHosts: !!js ctx.webRuntime.trustedHosts

    # Raw Blob and ReadableStream uploads run independently of Connection's
    # RPC and generation service.
    - id: file-upload
      name: '@orochi-network/oh-client-file-upload'

    - id: api-remotes
      name: '@orochi-network/oh-api-remotes'

    - id: cordis-client-runner
      name: '@orochi-network/oh-cordis-client-runner'

    - id: ui-theme
      name: '@orochi-network/oh-client-ui-theme'

    - id: locale
      name: '@orochi-network/oh-client-locale'

    - id: shortcuts
      name: '@orochi-network/oh-client-shortcuts'

    - id: ui-shortcuts
      name: '@orochi-network/oh-client-ui-shortcuts'

    - id: ui-layout
      name: '@orochi-network/oh-client-ui-layout'

    - id: ui-renderer
      name: '@orochi-network/oh-client-ui-renderer'

    - id: ui-session
      name: '@orochi-network/oh-client-ui-session'

    # Unified resource model: protocol providers behind the useResource hook.
    - id: resources
      name: '@orochi-network/oh-client-resources'

    - id: ui-sidebar
      name: '@orochi-network/oh-client-ui-sidebar'

    # The right Sidebar: one docking surface per session over ui-dockkit.
    - id: ui-sidebar-right
      name: '@orochi-network/oh-client-ui-sidebar-right'


    - id: office-to-pdf
      name: '@orochi-network/oh-office-to-pdf'

    # The right Sidebar's document tab: bounded file reads with selectable
    # Markdown, code, HTML, PDF, Office, and plain-text renderers.
    - id: ui-sidebar-documentpreview
      name: '@orochi-network/oh-client-ui-sidebar-documentpreview'

    # Web profiles opt in; Desktop retains sandboxed HTTP(S) Browser tabs.
    - id: ui-sidebar-browser
      name: '@orochi-network/oh-client-ui-sidebar-browser'
      disabled: !!js "ctx.get('profileContext')?.name !== 'desktop'"

    - id: ui-sidebar-terminal
      name: '@orochi-network/oh-client-ui-sidebar-terminal'
    # The right Sidebar's workspace file tree tab type.
    - id: ui-sidebar-files
      name: '@orochi-network/oh-client-ui-sidebar-files'

    - id: ui-settings
      name: '@orochi-network/oh-client-ui-settings'

    - id: ui-settings-general
      name: '@orochi-network/oh-client-ui-settings-general'

    - id: ui-settings-models
      name: '@orochi-network/oh-client-ui-settings-models'

    # The System Prompt settings section: the deployment persona templates and
    # their custom {{name}} variables over the system-prompt namespace.
    - id: ui-settings-system-prompt
      name: '@orochi-network/oh-client-ui-settings-system-prompt'

    # Plugin management: the sidebar Plugins page installs, enables, disables,
    # and removes the profile's bundles through the `pluginManager` Remote.
    # Without a profile-backed Host it reports itself unavailable.
    - id: ui-plugin-manager
      name: '@orochi-network/oh-client-ui-plugin-manager'

    # Read-only Plugin list tab in the Settings Plugins section; the built-in
    # bundles the sidebar page leaves out are inspected here.
    - id: ui-settings-plugin-inventory
      name: '@orochi-network/oh-client-ui-settings-plugin-inventory'

    - id: ui-conversation
      name: '@orochi-network/oh-client-ui-conversation'

    - id: ui-approval
      name: '@orochi-network/oh-client-ui-approval'

    - id: ui-chat
      name: '@orochi-network/oh-client-ui-chat'

    # Official occupants for the generic sidebar and conversation brand slots.
    - id: ui-brand-official
      name: '@orochi-network/oh-client-ui-brand-official'

    - id: ui-attachment
      name: '@orochi-network/oh-client-ui-attachment'

    # Tool call tree, generic fallback, and keyed business Tool views.
    - id: ui-tool
      name: '@orochi-network/oh-client-ui-tool'

    - id: ui-cordis
      name: '@orochi-network/oh-client-ui-cordis'

    # Turn tail: the changed-files card and delivery cards under each closing
    # assistant message. Remove this entry to turn the surface off; the tail
    # hole renders empty.
    - id: ui-deliverables
      name: '@orochi-network/oh-client-ui-deliverables'

    # Records each top-level turn's changed files from git working-tree
    # snapshots; the changed-files card above renders its events.
    - id: workspace-changes
      name: '@orochi-network/oh-workspace-changes'


    - id: ui-workspace
      name: '@orochi-network/oh-client-ui-workspace'

    # Durable workflow lifecycle as an independent Chat node after the
    # existing generic workflow tool row.
    - id: ui-workflow-run
      name: '@orochi-network/oh-client-ui-workflow-run'

    # Input triggers: the '/' | '@' pipeline (ui-input-trigger), the command surface over
    # it (ui-commands), and the reference sources (ui-skill / ui-reference).
    - id: ui-input-trigger
      name: '@orochi-network/oh-client-ui-input-trigger'

    - id: ui-commands
      name: '@orochi-network/oh-client-ui-commands'

    - id: ui-skill
      name: '@orochi-network/oh-client-ui-skill'

    - id: ui-subagent
      name: '@orochi-network/oh-client-ui-subagent'

    - id: ui-reference
      name: '@orochi-network/oh-client-ui-reference'


    # Background jobs: the session-header roster with on-demand streaming
    # record panels over the session job-output service.
    - id: ui-jobs
      name: '@orochi-network/oh-client-ui-jobs'

    # Goal surface: GoalBar in the input dock over the goal session projection.
    - id: ui-goal
      name: '@orochi-network/oh-client-ui-goal'

    # The feedback surface: Like/Dislike in the assistant-message action
    # strip, the feedback dialog behind Dislike and /feedback with its
    # acknowledgement toast, over the messageFeedback and sessionFeedback Remotes.
    - id: ui-message-feedback
      name: '@orochi-network/oh-client-ui-message-feedback'

    # Model selection: the /model popupSelect + composer seat over session.models.
    - id: ui-model-selection
      name: '@orochi-network/oh-client-ui-model-selection'

    - id: ui-permission
      name: '@orochi-network/oh-client-ui-permission-presets'

    # The agent-preset row in General settings: the default preset for
    # sessions created later. Absent a roster it renders nothing.
    - id: ui-agent-preset
      name: '@orochi-network/oh-client-ui-agent-preset'

    # The Built-in plugins settings section: the navigation entry and the tab
    # row the inventory tab registers into. The official configuration pages
    # are the companion rows below.
    - id: ui-settings-plugins
      name: '@orochi-network/oh-client-ui-settings-plugins'

    # The official settings pages: one companion package per host-plane
    # namespace, each registering its page into the Plugins page while the
    # Host serves the namespace.
    - id: ui-settings-shell
      name: '@orochi-network/oh-client-ui-settings-shell'

    - id: ui-settings-agent-loop
      name: '@orochi-network/oh-client-ui-settings-agent-loop'

    - id: ui-settings-subagent
      name: '@orochi-network/oh-client-ui-settings-subagent'

    - id: ui-settings-web-search
      name: '@orochi-network/oh-client-ui-settings-web-search'

    # Plan control: the composer plan seat over the plan projection + /plan channel.
    - id: ui-plan
      name: '@orochi-network/oh-client-ui-plan'

    - id: ui-user-questions
      name: '@orochi-network/oh-client-ui-user-questions'

    - id: ui-trajectory
      name: '@orochi-network/oh-client-ui-trajectory'

# ── the agent plane moves behind agent presets ─────────────────────────────
#
# Every row below composes what ONE agent contributes to the host registries:
# its tools, its prompt sections, its delegation backends. The base keeps them
# for the TUI, which is single-session and composes its agent process-wide; the
# Web surface disables them here and lets each session mount a preset instead.
#
# Disabling rather than deleting is deliberate: the base is shared, and a row
# absent from a surface overlay would silently reappear the day someone reorders
# the composition.

# `shell-env` STAYS in the host plane: `apps/cli/src/web.ts` injects it to
# publish `OH_WEB_URL`/`OH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# would never reach the model's shell at all.

- id: tool-plugin-manager
  disabled: true

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

# The background-job REGISTRY stays on the host plane; only the model-facing
# `job_*` controls move. Its producers — `tool-bash` here, `tool-terminal` and a
# non-continuable `tool-subagent` elsewhere — are preset rows that resolve it
# with `ctx.get`, and an entry-local realm around the registry is invisible to
# every sibling row outside that realm, so `run_in_background` answered
# "background jobs unavailable" while the controls sat in the catalog. That is
# the `goals` criterion read from inside the preset: a Service a row outside its
# realm READS belongs to the plane both can see. The registry is keyed by owning
# agent, so one host instance serves every session exactly as before presets.

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

# The `skill` REGISTRY stays in the host plane. It is host+per-scope layered
# (the tools-registry shape): deployment-level providers — repository plugins,
# a host skill-filesystem row — register into its global layer, while a preset's
# `skill-filesystem` registers into that preset's layer, and each agent reads the
# merged catalog its scope chain selects. Only the per-agent rows move behind
# presets: the base host `skill-filesystem` row is disabled here (presets own local
# discovery), and `tool-skill` is what a preset mounts to give its agent the
# catalog and loader at all.

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

# The goal service and session driver stay on the host plane, where Gateway
# remotes resolve them. Presets own the human command and model-facing tool.

- id: command-goal
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

# The token METER stays on the host plane; only the compaction backend that
# reads it moves. It owns the context-meter projection units, and that table is
# process-wide, so preset ownership would make the meter a function of which
# presets happen to be mounted rather than a per-session fact. Same criterion as
# `tasks` and `goals`; the reasoning has one home in
# `.agents/notes/implemented/architecture/2026-08-10-host-plane-ownership-after-presets.md`.

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

# The subagent registry and its backends STAY in the host plane. `subagents` is
# a process singleton with a cross-session query surface (`listChildren`,
# `followup`) that the host api-proxy serves to the browser, and a provider
# registers under a globally unique name, so a per-session copy would both
# starve that host row and collide on the second session. What a preset
# chooses is which delegation TOOLS its agent sees, below.

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-ptc
  disabled: true

- id: tool-workflow
  disabled: true

# `base` ships this row disabled; the preset-plane gate reads declared row ids
# without regard to `disabled`, so this row must stay to keep `tool-ralph` off
# the host plane and out of collision with every preset's row.
- id: tool-ralph
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

# The preset selection registry. The shipped preset declarations follow as
# separate patch files under `presets/`, listed after this file in
# `package.json` `oh.bundle.patch`.
- insert:
    - id: agent-preset-registry
      name: '@orochi-network/oh-agent-preset-registry'
      config:
        default: standard
